<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<body>
    <h1>Entre em contato</h1>

     <nav>
        <a href="index.html">Início |</a>
        <a href="produtos.html">Serviços e Produtos |</a>
        <a href="contato.html">Contato |</a>
        <a href="apresentacao.html">Apresentação</a>
    </nav>
     
    <form action="#" method="post">
 <br>
    
        <label for="nome"> Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="email"> Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone">
        <br><br>

        <label for="servico"> Serviço ou Produto de interesse:</label>
        <select name="servico" id="servico">
            <option value=""> Selecione uma opção</option>
            <option value="produto">Produto</option>
            <option value="servico">Serviço</option>
            <option value="outro">Outro</option>
         </select>
        <br><br>

         <label for="data">Data desejada para atendimento:</label>
         <input type="date" id="data" name="data">
         <br><br>

         <label for="mensagem">Mensagem:</label>
         <br>
        <textarea name="mensagem" id="mensagem" rows="5" cols="40" required></textarea>
        <br><br>

        <input type="checkbox" id="termos" name="termos">
         <label for="termos">Aceito os termos de uso.</label>
         <br><br>

         <button type="submit">Enviar</button>
    </form>

</body>
</html>
